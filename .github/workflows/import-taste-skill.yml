name: Import taste-skill

on:
  push:
    paths:
      - '.github/workflows/import-taste-skill.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream taste-skill
        shell: bash
        run: |
          git clone --depth 1 https://github.com/Leonxlnx/taste-skill.git /tmp/taste-skill
          echo "UPSTREAM_SHA=$(git -C /tmp/taste-skill rev-parse HEAD)" >> "$GITHUB_ENV"
          rm -rf /tmp/taste-skill/.git

      - name: Mirror upstream working tree
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/taste-skill/. .

      - name: Commit and push imported snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "chore: import Leonxlnx/taste-skill@${UPSTREAM_SHA}"
          git push origin HEAD:main
