name: Import figma-design-pipeline

on:
  push:
    branches:
      - feat/unified-web-designer
    paths:
      - .github/workflows/import-figma-design-pipeline.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Web-Designer
        uses: actions/checkout@v4
        with:
          ref: feat/unified-web-designer
          fetch-depth: 0

      - name: Clone pinned upstream
        run: |
          rm -rf /tmp/figma-design-pipeline
          git clone https://github.com/spfr/figma-design-pipeline.git /tmp/figma-design-pipeline
          cd /tmp/figma-design-pipeline
          git checkout f51a7ee82a34c374d2bc209cb8aac4d5a36044b6

      - name: Vendor upstream source
        run: |
          rm -rf vendor/figma-design-pipeline
          mkdir -p vendor/figma-design-pipeline
          rsync -a --exclude='.git' /tmp/figma-design-pipeline/ vendor/figma-design-pipeline/

      - name: Record upstream revision
        run: |
          cat > vendor/figma-design-pipeline/UPSTREAM.md <<'EOF'
          # Upstream

          Vendored from `spfr/figma-design-pipeline`.

          - Repository: https://github.com/spfr/figma-design-pipeline
          - Commit: `f51a7ee82a34c374d2bc209cb8aac4d5a36044b6`
          - Version: `0.8.0`
          - License: MIT (see `LICENSE` in this directory)

          Keep local integration code outside this vendor directory. Update the snapshot deliberately and re-run its own checks before merging.
          EOF

      - name: Remove one-time importer
        run: rm -f .github/workflows/import-figma-design-pipeline.yml

      - name: Commit vendor snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: vendor figma-design-pipeline@f51a7ee8'
          git push origin HEAD:feat/unified-web-designer
