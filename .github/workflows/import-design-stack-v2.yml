name: Import Design Stack v2

on:
  push:
    branches:
      - feat/design-stack-v2
    paths:
      - .github/workflows/import-design-stack-v2.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import pinned upstream repositories
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          git clone --quiet https://github.com/addyosmani/agent-skills.git "$tmp/agent-skills"
          git -C "$tmp/agent-skills" checkout --quiet f63ec56a3cc936408d792956ae583c3c96a825bd

          git clone --quiet https://github.com/cathrynlavery/diagram-design.git "$tmp/diagram-design"
          git -C "$tmp/diagram-design" checkout --quiet ac490fd1ac4b4014100f93e729cb4ad198700bd4

          rm -rf vendor/agent-skills vendor/diagram-design
          mkdir -p vendor/agent-skills vendor/diagram-design

          rsync -a --delete --exclude='.git' "$tmp/agent-skills/" vendor/agent-skills/
          rsync -a --delete --exclude='.git' "$tmp/diagram-design/" vendor/diagram-design/

          cat > vendor/agent-skills/UPSTREAM.md <<'EOF'
          # Upstream

          - Repository: https://github.com/addyosmani/agent-skills
          - Commit: `f63ec56a3cc936408d792956ae583c3c96a825bd`
          - Imported: 2026-08-28
          - License: MIT (see `LICENSE`)

          This directory is a pinned upstream snapshot. Put I’MON-specific routing and policy outside `vendor/`.
          EOF

          cat > vendor/diagram-design/UPSTREAM.md <<'EOF'
          # Upstream

          - Repository: https://github.com/cathrynlavery/diagram-design
          - Commit: `ac490fd1ac4b4014100f93e729cb4ad198700bd4`
          - Imported: 2026-08-28
          - License: MIT (see `LICENSE`)

          This directory is a pinned upstream snapshot. Put I’MON-specific routing and policy outside `vendor/`.
          EOF

          rm -f .github/workflows/import-design-stack-v2.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: vendor agent-skills and diagram-design'
          git push origin HEAD:feat/design-stack-v2
